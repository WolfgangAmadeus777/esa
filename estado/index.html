  <script>
    function gerarUTMs() {
      const params = new URLSearchParams(window.location.search);

      let utm_source = params.get("utm_source") || "organic";
      let utm_campaign = params.get("utm_campaign") || "";
      let utm_medium = params.get("utm_medium") || "";
      let utm_content = params.get("utm_content") || "";
      let utm_term = params.get("utm_term") || "";
      let xcod = params.get("xcod") || "";

      return `?utm_source=${encodeURIComponent(utm_source)}`
        + `&utm_campaign=${encodeURIComponent(utm_campaign)}`
        + `&utm_medium=${encodeURIComponent(utm_medium)}`
        + `&utm_content=${encodeURIComponent(utm_content)}`
        + `&utm_term=${encodeURIComponent(utm_term)}`
        + `&xcod=${encodeURIComponent(xcod)}`;
    }

    document.addEventListener("DOMContentLoaded", function () {
      window.utmifyNext = gerarUTMs();
    });
  </script>

  <!-- ðŸ”§ SCRIPT FINAL COM REDIRECIONAMENTO UTM CORRIGIDO -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const estadoSelect = document.querySelector('select[name="estado"]');
      const continuarBtn = document.querySelector("button");

      continuarBtn.addEventListener("click", function () {

        const estadoSelecionado = estadoSelect.value;
        localStorage.setItem("estado", estadoSelecionado);

        const next = "../endereco/" + (window.utmifyNext || "");
        window.location.href = next;
      });

      const estadoSalvo = localStorage.getItem("estado");
      if (estadoSalvo) {
        estadoSelect.value = estadoSalvo;
      }
    });
